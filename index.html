<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دعوتك | معرض الصقور والصيد السعودي الدولي 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#C08F32; --bg:#0d0b09; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#fff;font-family:Tajawal,system-ui,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px 40px}
  h1{font-size:18px;font-weight:700;margin:0;text-align:center;opacity:.9}
  .row{display:flex;gap:10px;width:100%;max-width:420px}
  input{flex:1;min-width:0;padding:14px 16px;border-radius:12px;border:1px solid #3a3229;
        background:#17130f;color:#fff;font:600 17px Tajawal,sans-serif;text-align:center}
  input:focus{outline:2px solid var(--gold);border-color:transparent}
  button{padding:14px 20px;border:0;border-radius:12px;background:var(--gold);color:#1a1206;
         font:800 16px Tajawal,sans-serif;cursor:pointer}
  button[disabled]{opacity:.45;cursor:not-allowed}
  canvas{width:100%;max-width:420px;height:auto;border-radius:14px;box-shadow:0 10px 40px #0009}
  .hint{font-size:13px;opacity:.55;text-align:center}
</style>
</head>
<body>
  <h1>اكتب اسمك لتظهر دعوتك</h1>
  <div class="row">
    <input id="name" maxlength="34" placeholder="الاسم الكريم" autocomplete="off">
  </div>
  <canvas id="c"></canvas>
  <div class="row"><button id="dl" disabled>تحميل الدعوة</button></div>
  <p class="hint">الدعوة تُحفظ صورة جاهزة للمشاركة</p>

<script>
// gold box in the 1400x2488 artwork
const BOX = {x:255, y:377, w:890, h:105};
const c = document.getElementById('c'), ctx = c.getContext('2d');
const input = document.getElementById('name'), dl = document.getElementById('dl');
const img = new Image();

function draw(){
  if(!img.complete || !img.naturalWidth) return;
  ctx.drawImage(img,0,0);
  const name = input.value.trim();
  dl.disabled = !name;
  if(!name) return;
  let size = 58;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#FFFFFF';
  do { ctx.font = '800 '+size+'px Tajawal, sans-serif'; size -= 2; }
  while(ctx.measureText(name).width > BOX.w-60 && size > 18);
  ctx.fillText(name, BOX.x+BOX.w/2, BOX.y+BOX.h/2+2);
}

img.onload = ()=>{ c.width=img.naturalWidth; c.height=img.naturalHeight; draw(); };
img.src = 'invite.jpg';
input.addEventListener('input', draw);
if(document.fonts) document.fonts.ready.then(draw);

dl.addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.download = 'دعوة-'+(input.value.trim()||'ضيف')+'.jpg';
  a.href = c.toDataURL('image/jpeg', 0.92);
  a.click();
});
</script>
</body>
</html>
